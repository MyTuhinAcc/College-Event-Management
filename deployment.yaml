
apiVersion: apps/v1
kind: Deployment
metadata:
  name: college-events
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: college-events
  template:
    metadata:
      labels:
        app: college-events
    spec:
      containers:
        - name: college-events
          image: tuhinnew/college-events:latest
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: college-events-service
spec:
  type: NodePort
  selector:
    app: college-events
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30084
